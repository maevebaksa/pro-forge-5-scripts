  {% if 'fan_generic filter_fan' in printer %}
    SET_FAN_SPEED FAN=filter_fan SPEED=0
  {% endif %}


[virtual_sdcard]
on_error_gcode:
  {% if printer['gcode_macro _RS'].failed %}
    SET_IDLE_TIMEOUT TIMEOUT=86400
    RESPOND MSG="Tool recovery stopped. Inspect, then PF_RETRY and RESUME."
  {% else %}
    CANCEL_PRINT
  {% endif %}


[gcode_macro CANCEL_PRINT]
gcode:
  CANCEL_PRINT_BASE
  TURN_OFF_HEATERS
  M107
  SET_IDLE_TIMEOUT TIMEOUT=600
  _TOOLCHANGER_CLEAR_PENDING
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_restore_tool VALUE=-1
  RESPOND MSG="Print cancelled; no automatic docking. PF_CLEAR after inspecting tools."


[gcode_macro _RS_PRIME]
gcode:
  {% set t = params.TOOL|int %}
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set k = ['zero','one','two','three','four'][t] %}
  {% if s.busy or s.failed or s.mounted|int != t or printer['gcode_button carriage_tool_sensor'].state != 'PRESSED' %}
    {action_raise_error('Tool is not verified for priming.')}
  {% endif %}
  SAVE_GCODE_STATE NAME=RS_PRIME
  _RS_MOVE X={s.safe_x} F=9000
  _RS_MOVE Y={v[k ~ '_dock_y']} F=9000
  _RS_MOVE X={v[k ~ '_select_x']+8} F=2400
  {% if printer[printer.toolhead.extruder].temperature < 180 %}
    M109 S200
  {% endif %}
  M83
  G1 E25 F600
  G1 E-2 F2400
  {% for wipe in range(4) %}
    _RS_MOVE X={v[k ~ '_select_x']+16} F=6000
    _RS_MOVE X={v[k ~ '_select_x']+8} F=6000
  {% endfor %}
  G1 E-0.5 F1500
  _RS_MOVE X={s.safe_x} F=9000
  RESTORE_GCODE_STATE NAME=RS_PRIME MOVE=0
  DOCK

