# ProForge 5 standalone recovery overlay, for config-20261023-131306.
# Include LAST, after macros.cfg/calibrate-offsets.cfg, BEFORE SAVE_CONFIG.
# Existing macro sections are intentionally overridden; do NOT add rename_existing.
# Remove this include and RESTART to revert. No persistent variables are written.
# MACHINE coordinates. Speeds below are mm/s. No timer initiates recovery motion.
# First test supervised, cold, clear bed. A switch cannot prove mechanical retention.
[gcode_macro _RS]
variable_safe_x: 0.0
variable_reseat_x: [-47.0, -47.0, -47.0, -47.0, -47.0]
variable_slow_distance: 5.0
variable_travel_speed: 150.0
variable_push_speed: 2.0
variable_push_accel: 100.0
variable_settle_ms: 200
variable_servo_ms: 1100
variable_open_angle: 52.0
variable_lock_angle: 100.0
variable_max_pushes: 2
# These runtime fields must not be edited while a transaction is active.
variable_busy: 0
variable_failed: 0
variable_mounted: -1
variable_target: -1
variable_borrowed: -1
variable_cal: 0
variable_steps: 0
variable_pushes: [0,0,0,0,0]
variable_pick_retries: [0,0,0,0,0]
variable_dock_retries: [0,0,0,0,0]
variable_entry: [0.0,0.0,0.0]
variable_origin: [0.0,0.0,0.0]
variable_old_offset: [0.0,0.0,0.0]
variable_old_extruder: 'extruder'
variable_printing: 0
variable_prime: 0
variable_retry_tool: -1
variable_retry_borrow: 0
gcode:


[gcode_macro PF_RESEAT]
gcode:
  _RS_START TARGET=-2


[gcode_macro PF_RESEAT_STATUS]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {action_respond_info('Reseat busy=%s failed=%s mounted=PH%s target=%s carriage=%s open=%s' % (s.busy,s.failed,s.mounted|int+1,s.target,car,ns.open))}


[gcode_macro _RS_START]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% set t = params.TARGET|int %}
  {% set cal = params.CAL|default(0)|int %}
  {% set old = 0 if printer.toolhead.extruder == 'extruder' else printer.toolhead.extruder[8:]|int %}
  {% set check = namespace(error='') %}
  {% if s.busy or s.failed %}
    {action_raise_error('Recovery is locked. Use PF_RESEAT_STATUS, then PF_RETRY or PF_CLEAR after inspection.')}
  {% endif %}
  {% if n < 1 or n > 5 or t < -2 or t >= n %}
    {% set check.error = 'invalid_tool_count_or_target' %}
  {% elif 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
    {% set check.error = 'home_XY_before_toolchange' %}
  {% elif printer.print_stats.state == 'printing' and ('z' not in printer.toolhead.homed_axes or printer.toolhead.position.z+2 > printer.toolhead.axis_maximum.z) %}
    {% set check.error = 'no_room_for_safe_Z_lift' %}
  {% elif ns.bad or car not in ['PRESSED','RELEASED'] %}
    {% set check.error = 'invalid_sensor_state' %}
  {% endif %}
  {% for i in range(n) %}
    {% for k in ['select_x','select_y','dock_x','dock_y'] %}
      {% if names[i] ~ '_' ~ k not in v %}{% set check.error = 'missing_dock_coordinate' %}{% endif %}
    {% endfor %}
  {% endfor %}
  {% if not cal and t >= 0 %}
    {% for i in [t,old] %}
      {% if i > 0 %}
        {% for ax in ['x','y','z'] %}
          {% if names[i] ~ '_' ~ ax ~ '_offset' not in v %}{% set check.error = 'restore_missing_tool_offsets_first' %}{% endif %}
        {% endfor %}
      {% endif %}
    {% endfor %}
  {% endif %}
  {% if s.safe_x > printer.toolhead.axis_maximum.x or s.safe_x < printer.toolhead.axis_minimum.x or s.travel_speed <= 0 or s.push_speed <= 0 or s.push_accel <= 0 or s.slow_distance <= 0 or s.max_pushes < 1 %}
    {% set check.error = 'invalid_reseat_settings' %}
  {% endif %}
  {% if not check.error %}
    {% for i in range(n) %}
      {% if s.reseat_x[i] < printer.toolhead.axis_minimum.x or s.reseat_x[i] + s.slow_distance > s.safe_x %}
        {% set check.error = 'invalid_reseat_X' %}
      {% endif %}
      {% for k in ['select_x','dock_x'] %}
        {% if v[names[i] ~ '_' ~ k] < printer.toolhead.axis_minimum.x or v[names[i] ~ '_' ~ k] + 8 > s.safe_x %}{% set check.error = 'invalid_dock_X' %}{% endif %}
      {% endfor %}
      {% for k in ['select_y','dock_y'] %}
        {% if v[names[i] ~ '_' ~ k] < printer.toolhead.axis_minimum.y or v[names[i] ~ '_' ~ k] > printer.toolhead.axis_maximum.y %}{% set check.error = 'invalid_dock_Y' %}{% endif %}
      {% endfor %}
    {% endfor %}
  {% endif %}
  {% if check.error %}
    _RS_FAIL MSG={check.error}
  {% else %}
    _TOOLCHANGER_CLEAR_PENDING
    SAVE_GCODE_STATE NAME=RS_ENTRY
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=entry VALUE="{[printer.gcode_move.gcode_position.x,printer.gcode_move.gcode_position.y,printer.gcode_move.gcode_position.z]}"
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=origin VALUE="{[printer.gcode_move.homing_origin.x,printer.gcode_move.homing_origin.y,printer.gcode_move.homing_origin.z]}"
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=old_offset VALUE="{[v[names[old] ~ '_x_offset']|default(0)|float,v[names[old] ~ '_y_offset']|default(0)|float,v[names[old] ~ '_z_offset']|default(0)|float] if old > 0 else [0.0,0.0,0.0]}"
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=old_extruder VALUE='"{printer.toolhead.extruder}"'
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=printing VALUE={1 if printer.print_stats.state == 'printing' else 0}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=target VALUE={t}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=cal VALUE={cal}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=borrowed VALUE=-1
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=prime VALUE=0
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=retry_tool VALUE=-1
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=steps VALUE=0
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=pushes VALUE="{[0,0,0,0,0]}"
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=pick_retries VALUE="{[0,0,0,0,0]}"
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=dock_retries VALUE="{[0,0,0,0,0]}"
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=busy VALUE=1
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    {% if car == 'RELEASED' %}SET_GCODE_VARIABLE MACRO=_RS VARIABLE=mounted VALUE=-1{% endif %}
    M400
    G4 P{s.settle_ms}
    M400
    {% if printer.print_stats.state == 'printing' and 'z' in printer.toolhead.homed_axes %}
      G91
      G1 Z2 F600
      G90
    {% endif %}
    {% for tick in range(24) %}_RS_DISPATCH
    {% endfor %}
    _RS_REQUIRE_DONE
  {% endif %}


[gcode_macro _RS_DISPATCH]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% set m = s.mounted|int %}
  {% if s.failed %}
    _RS_ABORT MSG=transaction_not_active
  {% elif not s.busy %}
    # Transaction already completed.
  {% elif s.retry_tool|int >= 0 %}
    _RS_PICK_RETRY TOOL={s.retry_tool|int} BORROW={s.retry_borrow|int}
  {% elif s.steps|int >= 24 %}
    _RS_FAIL MSG=recovery_step_limit
  {% elif ns.bad or car not in ['PRESSED','RELEASED'] %}
    _RS_FAIL MSG=invalid_sensor_state
  {% elif car == 'PRESSED' %}
    {% if m < 0 and ns.open|length == 1 %}
      SET_GCODE_VARIABLE MACRO=_RS VARIABLE=mounted VALUE={ns.open[0]}
      # Next top-level tick reads fresh state.
    {% elif m < 0 or m not in ns.open %}
      _RS_FAIL MSG=mounted_tool_identity_unknown_or_conflicting
    {% else %}
      {% set others = ns.open|reject('equalto',m)|list %}
      {% if others %}
        _RS_PUSH TOOL={others[0]}
      {% elif s.borrowed|int >= 0 %}
        _RS_DOCK TOOL={m}
      {% elif s.target|int == m or s.target|int == -2 %}
        _RS_FINISH
      {% else %}
        _RS_DOCK TOOL={m}
      {% endif %}
    {% endif %}
  {% elif ns.open %}
    {% if ns.docked %}
      _RS_PICK TOOL={ns.docked[0]} BORROW=1
    {% else %}
      _RS_FAIL MSG=no_confirmed_docked_tool_to_borrow
    {% endif %}
  {% elif s.target|int >= 0 %}
    _RS_PICK TOOL={s.target|int} BORROW=0
  {% else %}
    _RS_FINISH
  {% endif %}


[gcode_macro _RS_MOVE]
gcode:
  {% set p = printer.toolhead.position %}
  {% set g = printer.gcode_move.gcode_position %}
  G90
  G1 {% if 'X' in params %}X{params.X|float + g.x-p.x}{% endif %} {% if 'Y' in params %}Y{params.Y|float + g.y-p.y}{% endif %} F{params.F|float}


[gcode_macro _RS_SERVO]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set angle = params.ANGLE|float %}
  {% set c = printer.configfile.settings['servo toolchanger'] %}
  {% set lo = c.minimum_pulse_width|default(0.001)|float %}
  {% set hi = c.maximum_pulse_width|default(0.002)|float %}
  {% set target = (lo + (hi-lo)*angle/(c.maximum_servo_angle|default(180)|float))/0.020 %}
  {% set changed = (printer['servo toolchanger'].value|float-target)|abs > 0.00001 %}
  M400
  SET_SERVO SERVO=toolchanger ANGLE={angle}
  {% if changed or params.FORCE|default(0)|int %}G4 P{s.servo_ms}{% endif %}
  M400


[gcode_macro _SERVO_DOCK]
gcode:
  _RS_SERVO ANGLE={printer['gcode_macro _RS'].open_angle} FORCE={params.FORCE|default(0)|int}


[gcode_macro _SERVO_SELECT]
gcode:
  _RS_SERVO ANGLE={printer['gcode_macro _RS'].lock_angle} FORCE={params.FORCE|default(0)|int}


[gcode_macro _RS_PICK]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% set t = params.TOOL|int %}
  {% set b = params.BORROW|int %}
  {% set k = names[t] %}
  {% if car != 'RELEASED' or t not in ns.docked %}
    _RS_FAIL MSG=pickup_precondition_changed
  {% else %}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=steps VALUE={s.steps|int+1}
    {% if b %}SET_GCODE_VARIABLE MACRO=_RS VARIABLE=borrowed VALUE={t}{% endif %}
    _RS_MOVE X={s.safe_x} F={s.travel_speed*60}
    _SERVO_DOCK
    _RS_MOVE Y={v[k ~ '_select_y']} F={s.travel_speed*60}
    _RS_MOVE X={v[k ~ '_select_x']+5} F={s.travel_speed*60}
    _RS_MOVE X={v[k ~ '_select_x']} F=1200
    _RS_MOVE Y={v[k ~ '_dock_y']} F=1200
    _SERVO_SELECT
    G4 P{s.settle_ms}
    M400
    _RS_LOCK_CHECK TOOL={t} BORROW={b} SECOND=0
  {% endif %}


[gcode_macro _RS_LOCK_CHECK]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% set t = params.TOOL|int %}
  {% if car == 'PRESSED' %}
    _RS_MOVE X={v[names[t] ~ '_select_x']+8} F=2400
    _RS_MOVE X={s.safe_x} F={s.travel_speed*60}
    G4 P{s.settle_ms}
    M400
    _RS_PICK_CHECK TOOL={t} BORROW={params.BORROW}
  {% elif car == 'RELEASED' and t in ns.docked %}
    {% if not params.SECOND|int %}
      _SERVO_SELECT FORCE=1
      G4 P{s.settle_ms}
      M400
      _RS_LOCK_SECOND TOOL={t} BORROW={params.BORROW} SECOND=1
    {% else %}
      _SERVO_DOCK
      _RS_MOVE Y={v[names[t] ~ '_select_y']} F=1200
      _RS_MOVE X={s.safe_x} F=2400
      M400
      SET_GCODE_VARIABLE MACRO=_RS VARIABLE=retry_tool VALUE={t}
      SET_GCODE_VARIABLE MACRO=_RS VARIABLE=retry_borrow VALUE={params.BORROW}
    {% endif %}
  {% else %}
    _RS_FAIL MSG=pickup_ambiguous_no_safe_retreat
  {% endif %}


[gcode_macro _RS_LOCK_SECOND]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% set t = params.TOOL|int %}
  {% if car == 'PRESSED' %}
    _RS_MOVE X={v[names[t] ~ '_select_x']+8} F=2400
    _RS_MOVE X={s.safe_x} F={s.travel_speed*60}
    G4 P{s.settle_ms}
    M400
    _RS_PICK_CHECK TOOL={t} BORROW={params.BORROW}
  {% elif car == 'RELEASED' and t in ns.docked %}
    {% if not params.SECOND|int %}
      _SERVO_SELECT FORCE=1
      G4 P{s.settle_ms}
      M400
      _RS_LOCK_SECOND TOOL={t} BORROW={params.BORROW} SECOND=1
    {% else %}
      _SERVO_DOCK
      _RS_MOVE Y={v[names[t] ~ '_select_y']} F=1200
      _RS_MOVE X={s.safe_x} F=2400
      M400
      SET_GCODE_VARIABLE MACRO=_RS VARIABLE=retry_tool VALUE={t}
      SET_GCODE_VARIABLE MACRO=_RS VARIABLE=retry_borrow VALUE={params.BORROW}
    {% endif %}
  {% else %}
    _RS_FAIL MSG=pickup_ambiguous_no_safe_retreat
  {% endif %}



[gcode_macro _RS_PICK_CHECK]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% set t = params.TOOL|int %}
  {% if car == 'PRESSED' and t in ns.open %}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=mounted VALUE={t}
    {% if not params.BORROW|int %}SET_GCODE_VARIABLE MACRO=_RS VARIABLE=prime VALUE=1{% endif %}
    # Next top-level tick reads fresh state.
  {% elif car == 'RELEASED' and t in ns.docked %}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=retry_tool VALUE={t}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=retry_borrow VALUE={params.BORROW}
  {% else %}
    _RS_FAIL MSG=pickup_not_confirmed_inspect_tool
  {% endif %}


[gcode_macro _RS_PICK_RETRY]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% set t = params.TOOL|int %}
  {% if car != 'RELEASED' or t not in ns.docked or s.pick_retries[t]|int >= 1 %}
    _RS_FAIL MSG=pickup_retry_exhausted_or_unsafe
  {% else %}
    {% set counts = s.pick_retries|list %}
    {% set unused = counts.__setitem__(t,1) %}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=pick_retries VALUE="{counts}"
    _RS_MOVE X={s.safe_x} F=2400
    M400
    G28 X Y
    M400
    G4 P{s.settle_ms}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=retry_tool VALUE=-1
    _RS_PICK TOOL={t} BORROW={params.BORROW}
  {% endif %}


[gcode_macro _RS_DOCK]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% set t = params.TOOL|int %}
  {% set k = names[t] %}
  {% if car != 'PRESSED' or s.mounted|int != t or ns.open != [t] %}
    _RS_FAIL MSG=dock_precondition_changed
  {% else %}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=steps VALUE={s.steps|int+1}
    {% if s.borrowed|int < 0 and printer.toolhead.extruder == ('extruder' if t == 0 else 'extruder' ~ t) %}
      _RETRACT
    {% endif %}
    _SERVO_SELECT
    _RS_MOVE X={s.safe_x} F={s.travel_speed*60}
    _RS_MOVE Y={v[k ~ '_dock_y']} F={s.travel_speed*60}
    _RS_MOVE X={v[k ~ '_dock_x']+5} F={s.travel_speed*60}
    _RS_MOVE X={v[k ~ '_dock_x']} F=1200
    _SERVO_DOCK
    _RS_MOVE Y={v[k ~ '_select_y']} F=1200
    _RS_MOVE X={v[k ~ '_dock_x']+10} F=2400
    _RS_MOVE X={s.safe_x} F={s.travel_speed*60}
    G4 P{s.settle_ms}
    M400
    _RS_DOCK_CHECK TOOL={t}
  {% endif %}


[gcode_macro _RS_DOCK_CHECK]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% set t = params.TOOL|int %}
  {% if car == 'RELEASED' %}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=mounted VALUE=-1
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=borrowed VALUE=-1
    # Next top-level tick reads fresh state.
  {% elif car == 'PRESSED' and ns.open == [t] and s.dock_retries[t]|int < 1 %}
    {% set counts = s.dock_retries|list %}
    {% set unused = counts.__setitem__(t,1) %}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=dock_retries VALUE="{counts}"
    # Next dispatcher tick retries the dock.
  {% else %}
    _RS_FAIL MSG=docking_not_confirmed
  {% endif %}


[gcode_macro _RS_PUSH]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% set t = params.TOOL|int %}
  {% if car != 'PRESSED' or s.mounted|int < 0 or t == s.mounted|int or s.mounted|int not in ns.open %}
    _RS_FAIL MSG=reseat_requires_verified_mounted_tool
  {% elif s.pushes[t]|int >= s.max_pushes|int %}
    _RS_FAIL MSG=reseat_attempts_exhausted
  {% else %}
    {% set counts = s.pushes|list %}
    {% set unused = counts.__setitem__(t,counts[t]|int+1) %}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=pushes VALUE="{counts}"
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=steps VALUE={s.steps|int+1}
    _SERVO_SELECT
    _RS_MOVE X={s.safe_x} F={s.travel_speed*60}
    _RS_MOVE Y={v[names[t] ~ '_dock_y']} F={s.travel_speed*60}
    _RS_MOVE X={s.reseat_x[t]+s.slow_distance} F={s.travel_speed*60}
    M400
    {% for step in range((s.slow_distance / 0.5)|round(0,'ceil')|int) %}
      _RS_PUSH_STEP TOOL={t} X={s.reseat_x[t]+s.slow_distance-(step+1)*0.5}
    {% endfor %}
    _RS_PUSH_RETURN
  {% endif %}


[gcode_macro _RS_PUSH_STEP]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% set t = params.TOOL|int %}
  {% set x = [params.X|float,s.reseat_x[t]]|max %}
  {% if car != 'PRESSED' or s.mounted|int not in ns.open %}
    _RS_FAIL MSG=mounted_tool_lost_during_reseat
  {% elif t in ns.docked %}
    # Switch already pressed; skip remaining push steps.
  {% else %}
    SET_VELOCITY_LIMIT ACCEL={s.push_accel}
    _RS_MOVE X={x} F={s.push_speed*60}
    M400
    SET_VELOCITY_LIMIT ACCEL={printer.toolhead.max_accel}
    G4 P{s.settle_ms}
    M400
  
  {% endif %}


[gcode_macro _RS_PUSH_RETURN]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% if car != 'PRESSED' or s.mounted|int not in ns.open %}
    _RS_FAIL MSG=mounted_tool_lost_after_reseat
  {% else %}
    _RS_MOVE X={s.safe_x} F=2400
    G4 P{s.settle_ms}
    M400
    # Next top-level tick reads fresh state.
  {% endif %}


[gcode_macro _RS_FINISH]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% set t = s.target|int %}
  {% if (car == 'PRESSED' and ns.open != [s.mounted|int]) or (car == 'RELEASED' and ns.open) %}
    _RS_FAIL MSG=final_sensor_verification_failed
  {% else %}
    {% if t >= 0 and s.prime and not s.cal %}
      ACTIVATE_EXTRUDER EXTRUDER={'extruder' if t == 0 else 'extruder' ~ t}
      _PRIME
    {% endif %}
    RESTORE_GCODE_STATE NAME=RS_ENTRY MOVE=0
    {% if t >= 0 %}
      ACTIVATE_EXTRUDER EXTRUDER={'extruder' if t == 0 else 'extruder' ~ t}
      {% if not s.cal %}
        {% set k = names[t] %}
        SET_GCODE_OFFSET X={s.origin[0]-s.old_offset[0]+(v[k ~ '_x_offset']|float if t else 0)} Y={s.origin[1]-s.old_offset[1]+(v[k ~ '_y_offset']|float if t else 0)} Z={s.origin[2]-s.old_offset[2]+(v[k ~ '_z_offset']|float if t else 0)} MOVE=0
      {% else %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
      {% endif %}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_restore_tool VALUE={t}
      SET_GCODE_VARIABLE MACRO=_RESUME_WIPE VARIABLE=extruder_restore_tool VALUE={t}
    {% else %}
      ACTIVATE_EXTRUDER EXTRUDER={s.old_extruder}
    {% endif %}
    _RS_RETURN
  {% endif %}


[gcode_macro _RS_RETURN]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% if s.printing and s.target|int != -1 %}
    SAVE_GCODE_STATE NAME=RS_RETURN_MODE
    G90
    G1 X{s.entry[0]} Y{s.entry[1]} F{s.travel_speed*60}
    G1 Z{s.entry[2]} F600
    RESTORE_GCODE_STATE NAME=RS_RETURN_MODE MOVE=0
  {% endif %}
  M400
  SET_GCODE_VARIABLE MACRO=_RS VARIABLE=busy VALUE=0
  SET_GCODE_VARIABLE MACRO=_RS VARIABLE=failed VALUE=0
  SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=1
  {% if printer.pause_resume.is_paused %}
    SAVE_GCODE_STATE NAME=PAUSE_STATE
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_restore_tool VALUE=-1
  {% endif %}
  {action_respond_info('Toolchanger transaction verified.')}


[gcode_macro _RS_FAIL]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  SET_GCODE_VARIABLE MACRO=_RS VARIABLE=failed VALUE=1
  SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
  _TOOLCHANGER_CLEAR_PENDING
  {% if printer.print_stats.state == 'printing' and not printer.pause_resume.is_paused %}
    PAUSE_BASE
  {% endif %}
  SET_IDLE_TIMEOUT TIMEOUT=86400
  _RS_ABORT MSG={params.MSG}


[gcode_macro _RS_ABORT]
gcode:
  {action_raise_error('Toolchanger stopped: ' ~ params.MSG|replace('_',' ') ~ '. Inspect mechanics; PF_RETRY retries the saved command. No automatic resume.')}


[gcode_macro PF_RETRY]
gcode:
  {% set s = printer['gcode_macro _RS'] %}
  {% set v = printer.save_variables.variables %}
  {% set n = v.active_tools|default(0)|int %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set car = printer['gcode_button carriage_tool_sensor'].state %}
  {% set ns = namespace(open=[], docked=[], bad=[]) %}
  {% for i in range(n) %}
    {% set st = printer['gcode_button t' ~ i ~ '_dock_sensor'].state %}
    {% if st == 'RELEASED' %}{% set ns.open = ns.open + [i] %}
    {% elif st == 'PRESSED' %}{% set ns.docked = ns.docked + [i] %}
    {% else %}{% set ns.bad = ns.bad + [i] %}{% endif %}
  {% endfor %}
  {% if not s.failed or not s.busy %}
    {action_raise_error('No saved transaction to retry. PF_CLEAR after inspection, then reissue your command.')}
  {% elif 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
    {action_raise_error('XY position is no longer known; inspect and home before retrying.')}
  {% else %}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=failed VALUE=0
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=steps VALUE=0
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=pushes VALUE="{[0,0,0,0,0]}"
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=pick_retries VALUE="{[0,0,0,0,0]}"
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=dock_retries VALUE="{[0,0,0,0,0]}"
    {% if car == 'RELEASED' %}
      SET_GCODE_VARIABLE MACRO=_RS VARIABLE=mounted VALUE=-1
      SET_GCODE_VARIABLE MACRO=_RS VARIABLE=borrowed VALUE=-1
    {% endif %}
    M400
    G4 P{s.settle_ms}
    M400
    {% for tick in range(24) %}_RS_DISPATCH
    {% endfor %}
    _RS_REQUIRE_DONE
  {% endif %}


[gcode_macro _RS_REQUIRE_DONE]
gcode:
  {% if printer['gcode_macro _RS'].busy %}_RS_FAIL MSG=transaction_did_not_finish{% endif %}


[gcode_macro PF_CLEAR]
gcode:
  {% if printer.print_stats.state in ['printing','paused'] or printer.pause_resume.is_paused %}
    {action_raise_error('Cancel the print before abandoning recovery. Use PF_RETRY to preserve its transaction.')}
  {% else %}
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=busy VALUE=0
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=failed VALUE=0
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=mounted VALUE=-1
    SET_GCODE_VARIABLE MACRO=_RS VARIABLE=borrowed VALUE=-1
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    _TOOLCHANGER_CLEAR_PENDING
  {% endif %}


