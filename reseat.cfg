[idle_timeout]
timeout: 600
gcode:
  {% if printer.pause_resume.is_paused %}
    SET_IDLE_TIMEOUT TIMEOUT=86400
  {% else %}
    TURN_OFF_HEATERS
    M84
  {% endif %}


[gcode_macro RESUME]
gcode:
  {% if printer['gcode_macro _RS'].busy or printer['gcode_macro _RS'].failed %}
    {action_raise_error('Tool recovery unresolved. Inspect and run PF_RETRY before RESUME.')}
  {% endif %}
  {% if extruder_restore_tool >= 0 %}
      {% if extruder_restore_temp > 0 %}
        M118 Resuming... Restoring temp {extruder_restore_temp}°C to tool T{extruder_restore_tool}
        M109 S{extruder_restore_temp} T{extruder_restore_tool}
        M118 Resuming... Restored temp {extruder_restore_temp}°C to tool T{extruder_restore_tool}
      {% else %}
        M118 Resuming... Tool T{extruder_restore_tool} had no saved temperature.
      {% endif %}
      _RESUME_WIPE
    {% else %}
      M118 Resuming... No tool was previously active. Skipping wipe and temperature restore.
    {% endif %}
    RESUME_BASE
    SET_IDLE_TIMEOUT TIMEOUT=600


[gcode_macro _END_PRINT]
gcode:
  DOCK
  _RS_END_FINISH


[gcode_macro _RS_END_FINISH]
gcode:
  {% if printer['gcode_macro _RS'].busy or printer['gcode_macro _RS'].failed or printer['gcode_button carriage_tool_sensor'].state != 'RELEASED' %}
    {action_raise_error('End print docking unresolved; motors retained.')}
  {% endif %}
  TURN_OFF_HEATERS
  M107
  {% if 'gcode_macro CHAMBER_OFF' in printer %}CHAMBER_OFF{% endif %}
  BED_MESH_CLEAR
  UPDATE_DELAYED_GCODE ID=FILTER_FAN_OFF DURATION=300
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_restore_tool VALUE=-1
  M400
  M84


